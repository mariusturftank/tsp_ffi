// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.example.tsp_ffi"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.example.tsp_ffi"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    defaultConfig {
        minSdk = 24

        // arm64-v8a is the only ABI this plugin ships. Each additional ABI is a
        // separate ~1 hour OR-Tools build and another ~11 MB binary, so the
        // others are deliberately unsupported: no armeabi-v7a, and no x86_64,
        // which means x86_64 emulators cannot run it. Consuming apps should set
        // the same filter — see README — otherwise they build an APK with no
        // libtsp_ffi.so for that ABI and fail at DynamicLibrary.open instead.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Use pre-built native libraries instead of building from source.
    // Build them with: cd src && ./build_android.sh arm64-v8a
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
